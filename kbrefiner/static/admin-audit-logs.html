    <style id="theme-vars">
/* 知序 KBRefiner — 产品前端设计系统 */

:root {
  /* ===== 品牌主色阶（单一主色） ===== */
  --kb-primary-50: #eff6ff;
  --kb-primary-100: #dbeafe;
  --kb-primary-200: #bfdbfe;
  --kb-primary-300: #93c5fd;
  --kb-primary-400: #60a5fa;
  --kb-primary-500: #3b82f6;
  --kb-primary-600: #2563eb;
  --kb-primary-700: #1d4ed8;
  --kb-primary-800: #1e40af;
  --kb-primary-900: #1e3a8a;

  /* ===== 中性色阶 ===== */
  --kb-neutral-0: #ffffff;
  --kb-neutral-50: #f8fafc;
  --kb-neutral-100: #f1f5f9;
  --kb-neutral-200: #e2e8f0;
  --kb-neutral-300: #cbd5e1;
  --kb-neutral-400: #94a3b8;
  --kb-neutral-500: #64748b;
  --kb-neutral-600: #475569;
  --kb-neutral-700: #334155;
  --kb-neutral-800: #1e293b;
  --kb-neutral-900: #0f172a;

  /* ===== 语义色（仅用于状态） ===== */
  --kb-state-success: #10b981;
  --kb-state-success-bg: #ecfdf5;
  --kb-state-warning: #f59e0b;
  --kb-state-warning-bg: #fffbeb;
  --kb-state-error: #ef4444;
  --kb-state-error-bg: #fef2f2;
  --kb-state-info: #0ea5e9;
  --kb-state-info-bg: #f0f9ff;

  /* ===== 语义状态边框/文字（管理后台新增） ===== */
  --kb-state-success-border: #a7f3d0;
  --kb-state-success-text: #047857;
  --kb-state-warning-border: #fde68a;
  --kb-state-warning-text: #b45309;
  --kb-state-error-border: #fecaca;
  --kb-state-error-text: #b91c1c;
  --kb-state-info-border: #bae6fd;
  --kb-state-info-text: #0369a1;

  /* ===== 语义别名 ===== */
  --kb-background: var(--kb-neutral-50);
  --kb-foreground: var(--kb-neutral-900);
  --kb-card: var(--kb-neutral-0);
  --kb-card-foreground: var(--kb-neutral-900);
  --kb-popover: var(--kb-neutral-0);
  --kb-popover-foreground: var(--kb-neutral-900);
  --kb-primary: var(--kb-primary-600);
  --kb-primary-foreground: var(--kb-neutral-0);
  --kb-muted: var(--kb-neutral-100);
  --kb-muted-foreground: var(--kb-neutral-500);
  --kb-border: var(--kb-neutral-200);
  --kb-input: var(--kb-neutral-200);
  --kb-ring: var(--kb-primary-300);

  --kb-radius-small: 4px;
  --kb-radius-medium: 8px;
  --kb-radius-large: 12px;

  /* ===== 字体系统 ===== */
  --kb-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --kb-font-mono: "GeistMono", "SF Mono", "Fira Code", ui-monospace, monospace;

  /* ===== 阴影 ===== */
  --kb-shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --kb-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --kb-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --kb-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --kb-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* ===== 间距 ===== */
  --kb-space-1: 4px;
  --kb-space-2: 8px;
  --kb-space-3: 12px;
  --kb-space-4: 16px;
  --kb-space-5: 20px;
  --kb-space-6: 24px;
  --kb-space-8: 32px;
  --kb-space-10: 40px;
  --kb-space-12: 48px;

  /* ===== 尺寸 ===== */
  --kb-header-height: 64px;
  --kb-sidebar-width: 220px;
  --kb-sidebar-collapsed: 64px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--kb-font-sans);
  background: var(--kb-background);
  color: var(--kb-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.3;
  font-weight: 700;
  color: var(--kb-foreground);
}

h1 { font-size: 1.875rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }

p { color: var(--kb-neutral-600); line-height: 1.7; }

a { color: var(--kb-primary); text-decoration: none; }
a:hover { color: var(--kb-primary-700); }

.kb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--kb-space-2);
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--kb-radius-medium);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.kb-btn-primary { background: var(--kb-primary); color: var(--kb-primary-foreground); }
.kb-btn-primary:hover { background: var(--kb-primary-700); }
.kb-btn-secondary { background: var(--kb-neutral-0); color: var(--kb-neutral-700); border-color: var(--kb-border); }
.kb-btn-secondary:hover { background: var(--kb-neutral-50); border-color: var(--kb-neutral-300); }
.kb-btn-ghost { background: transparent; color: var(--kb-neutral-600); }
.kb-btn-ghost:hover { background: var(--kb-neutral-100); color: var(--kb-neutral-900); }
.kb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kb-btn-sm { padding: 6px 12px; font-size: 0.8125rem; }

.kb-card {
  background: var(--kb-card);
  border: 1px solid var(--kb-border);
  border-radius: var(--kb-radius-large);
  box-shadow: var(--kb-shadow-xs);
}

.kb-card-header {
  padding: var(--kb-space-5) var(--kb-space-6);
  border-bottom: 1px solid var(--kb-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--kb-space-4);
}

.kb-card-body { padding: var(--kb-space-6); }

.kb-input,
.kb-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--kb-input);
  border-radius: var(--kb-radius-medium);
  background: var(--kb-neutral-0);
  color: var(--kb-foreground);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.kb-input:focus,
.kb-select:focus {
  outline: none;
  border-color: var(--kb-primary-400);
  box-shadow: 0 0 0 3px var(--kb-primary-100);
}

.kb-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1;
}

.kb-tag-primary { background: var(--kb-primary-100); color: var(--kb-primary-700); }
.kb-tag-success { background: var(--kb-state-success-bg); color: #047857; }
.kb-tag-warning { background: var(--kb-state-warning-bg); color: #b45309; }
.kb-tag-error { background: var(--kb-state-error-bg); color: #b91c1c; }
.kb-tag-info { background: var(--kb-state-info-bg); color: #0369a1; }
.kb-tag-muted { background: var(--kb-neutral-100); color: var(--kb-neutral-600); }

.kb-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  font-weight: 600;
}

.kb-status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.kb-status-pending::before { background: var(--kb-neutral-400); }
.kb-status-running::before { background: var(--kb-state-info); }
.kb-status-success::before { background: var(--kb-state-success); }
.kb-status-warning::before { background: var(--kb-state-warning); }
.kb-status-error::before { background: var(--kb-state-error); }

.kb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.kb-table th,
.kb-table td {
  padding: var(--kb-space-3) var(--kb-space-4);
  text-align: left;
  border-bottom: 1px solid var(--kb-border);
  vertical-align: middle;
}

.kb-table th {
  font-weight: 600;
  color: var(--kb-neutral-600);
  background: var(--kb-neutral-50);
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.kb-table tr:hover td { background: var(--kb-neutral-50); }

.kb-empty {
  text-align: center;
  padding: var(--kb-space-12) var(--kb-space-6);
  color: var(--kb-neutral-500);
}

.kb-text-muted { color: var(--kb-neutral-500); }
.kb-text-secondary { color: var(--kb-neutral-600); }
.kb-text-primary { color: var(--kb-primary); }
.kb-text-success { color: var(--kb-state-success); }
.kb-text-warning { color: var(--kb-state-warning); }
.kb-text-error { color: var(--kb-state-error); }
.kb-font-semibold { font-weight: 600; }
.kb-font-bold { font-weight: 700; }
.kb-text-sm { font-size: 0.875rem; }
.kb-text-xs { font-size: 0.75rem; }
.kb-truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 操作审计特有：角色 tag 配色 */
.kb-audit-role-super { background: #f3e8ff; color: #7c3aed; }
.kb-audit-role-admin { background: var(--kb-primary-100); color: var(--kb-primary-700); }
.kb-audit-role-user { background: var(--kb-neutral-100); color: var(--kb-neutral-600); }

    <script>
      lucide.createIcons();

      // 侧边栏移动端切换
      (function () {
        var menuBtn = document.querySelector('[data-dom-id="btn-admin-menu"]');
        var sidebar = document.getElementById('adminSidebar');
        var overlay = document.getElementById('adminOverlay');
        function toggle() {
          sidebar.classList.toggle('is-open');
          overlay.classList.toggle('is-visible');
        }
        if (menuBtn) menuBtn.addEventListener('click', toggle);
        if (overlay) overlay.addEventListener('click', toggle);
      })();

      const esc = KBRefiner.escapeHtml;

      // ===== 动作类型中文映射 =====
      function beautifyAction(action) {
        const map = {
          'auth.login.success': '登录成功',
          'auth.login.failed': '登录失败',
          'user.created': '创建用户',
          'user.updated': '更新用户资料',
          'user.role_changed': '变更角色',
          'user.deleted': '删除用户',
          'user.password_reset': '重置密码',
          'settings.updated': '修改系统设置',
          'access.rule_created': '新增访问规则',
          'access.rule_deleted': '删除访问规则',
          'access.toggled': '切换访问开关',
          'message.created': '新建消息',
          'message.sent': '发送消息',
          'message.revoked': '撤回消息',
          'message.deleted': '删除消息',
          'message.cancelled': '取消定时',
          'message.updated': '编辑消息',
          'task.cancelled': '取消任务',
          'task.batch': '批量操作任务',
        };
        return map[action] || action || '—';
      }

      const fmtTime = ts => {
        if (!ts) return '—';
        const d = new Date(ts * 1000);
        const p = x => String(x).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      };

      const roleTagClass = r => {
        if (r === 'super_admin') return 'kb-audit-role-super';
        if (r === 'admin') return 'kb-audit-role-admin';
        return 'kb-audit-role-user';
      };
      const roleLabel = r => {
        if (r === 'super_admin') return '超级管理员';
        if (r === 'admin') return '管理员';
        if (r === 'user') return '普通用户';
        return r || '—';
      };

      const truncate = (s, n) => {
        if (!s) return '';
        s = String(s);
        return s.length > n ? s.slice(0, n) + '…' : s;
      };

      // ===== 权限守卫 =====
      async function guard() {
        const { user } = await KBRefiner.Auth.me();
        if (!user || !['super_admin', 'admin'].includes(user.role)) {
          window.location.href = '/admin/login';
          return false;
        }
        document.getElementById('admin-name').textContent = user.username || '管理员';
        document.getElementById('admin-email').textContent = user.email || '-';
        document.getElementById('admin-avatar').textContent = (user.username || '管')[0];
        return true;
      }

      document.getElementById('btn-logout').addEventListener('click', async e => {
        e.preventDefault();
        await KBRefiner.Auth.logout().catch(() => {});
        window.location.href = '/admin/login';
      });

      // ===== 列表加载与分页 =====
      const PAGE_SIZE = 20;
      let currentPage = 1;
      let totalPages = 1;
      let totalCount = 0;

      async function loadAuditLogs() {
        const tbody = document.getElementById('audit-tbody');
        tbody.innerHTML = `<tr><td colspan="8" class="kb-text-muted" style="text-align:center;padding:40px;">加载中...</td></tr>`;
        const user_keyword = document.getElementById('audit-user-keyword').value.trim();
        const action = document.getElementById('audit-action').value;
        const days = Number(document.getElementById('audit-days').value) || 0;

        const params = new URLSearchParams({
          page: currentPage,
          limit: PAGE_SIZE,
        });
        if (user_keyword) params.set('user_keyword', user_keyword);
        if (action) params.set('action', action);
        if (days > 0) params.set('days', String(days));

        try {
          const resp = await KBRefiner.request(`/api/admin/audit-logs?${params.toString()}`, { method: 'GET' });
          const logs = (resp && resp.logs) || [];
          totalCount = (resp && typeof resp.total === 'number') ? resp.total : logs.length;
          totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
          if (currentPage > totalPages) currentPage = totalPages;

          document.getElementById('audit-total').textContent = `共 ${totalCount} 条`;
          document.getElementById('audit-page-info').textContent = `${currentPage} / ${totalPages}`;
          document.getElementById('btn-prev').disabled = currentPage <= 1;
          document.getElementById('btn-next').disabled = currentPage >= totalPages;

          if (!logs.length) {
            tbody.innerHTML = `<tr><td colspan="8" class="kb-text-muted" style="text-align:center;padding:40px;">暂无审计记录</td></tr>`;
            return;
          }

          tbody.innerHTML = logs.map(log => {
            const userPrefix = (log.user_id || '').toString().slice(0, 8);
            const objType = esc(log.object_type || log.target_type || '--');
            const objId = esc(log.object_id || log.target_id || '--');
            const detailRaw = log.detail || '';
            const detailShort = esc(truncate(detailRaw, 80));
            const detailFull = detailRaw ? esc(String(detailRaw)) : '';
            const titleAttr = detailFull ? ` title="${detailFull}"` : '';
            const ip = log.ip ? esc(String(log.ip)) : '--';
            return `<tr>
              <td class="kb-text-secondary kb-text-sm">${fmtTime(log.created_at)}</td>
              <td>
                <div class="kb-font-semibold">${esc(log.username || '--')}</div>
                <div class="kb-text-muted kb-text-xs">${userPrefix ? '(' + userPrefix + ')' : ''}</div>
              </td>
              <td><span class="kb-tag ${roleTagClass(log.role)}">${esc(roleLabel(log.role))}</span></td>
              <td class="kb-font-semibold">${esc(beautifyAction(log.action))}</td>
              <td class="kb-text-secondary kb-text-sm">${objType}</td>
              <td class="kb-text-secondary kb-text-sm">${objId}</td>
              <td class="kb-text-secondary kb-text-sm"${titleAttr}>${detailShort || '--'}</td>
              <td class="kb-text-secondary kb-text-sm">${ip}</td>
            </tr>`;
          }).join('');
          lucide.createIcons();
        } catch (e) {
          tbody.innerHTML = `<tr><td colspan="8" class="kb-text-error" style="text-align:center;padding:40px;">${esc(e.message || '加载失败')}</td></tr>`;
        }
      }

      document.getElementById('btn-audit-refresh').addEventListener('click', () => {
        currentPage = 1;
        loadAuditLogs();
      });
      document.getElementById('audit-action').addEventListener('change', () => { currentPage = 1; loadAuditLogs(); });
      document.getElementById('audit-days').addEventListener('change', () => { currentPage = 1; loadAuditLogs(); });
      let _tKwd = null;
      document.getElementById('audit-user-keyword').addEventListener('input', () => {
        clearTimeout(_tKwd);
        _tKwd = setTimeout(() => { currentPage = 1; loadAuditLogs(); }, 400);
      });
      document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; loadAuditLogs(); }
      });
      document.getElementById('btn-next').addEventListener('click', () => {
        if (currentPage < totalPages) { currentPage++; loadAuditLogs(); }
      });

      // ===== 初始化 =====
      (async () => {
        if (await guard()) await loadAuditLogs();
      })();
    </script>

    <style id="critical-layout">

    }
    .kb-sidebar-avatar {

    }

      font-size: 0.875rem;

    .kb-admin-overlay {
      display: none;

      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 25;
    }
    .kb-admin-overlay.is-visible { display: block; }

    /* ===== 主区域 ===== */
    .kb-admin-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }

    /* 顶部栏 */
    .kb-admin-topbar {
      height: var(--kb-header-height);
      background: var(--kb-neutral-0);
      border-bottom: 1px solid var(--kb-border);
      display: flex;
      align-items: center;
