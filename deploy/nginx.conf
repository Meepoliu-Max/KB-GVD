# KBRefiner Nginx 反向代理配置
# 放入: /etc/nginx/conf.d/kbrefiner.conf (或 sites-available)
# 替换:
#   SERVER_DOMAIN  -> 你的域名, 如 kb.example.com
#   127.0.0.1      -> 保持, 指向本地 docker 端口映射
#
# 使用前先执行: sudo bash setup-nginx.sh
# 该脚本会自动替换占位符并 reload nginx

server {
    listen 80;
    server_name SERVER_DOMAIN;

    # HTTP -> HTTPS 跳转
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name SERVER_DOMAIN;

    # SSL 证书路径（由 certbot 自动填充）
    ssl_certificate     /etc/letsencrypt/live/SERVER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传大小限制（与 MAX_UPLOAD_SIZE_MB 一致）
    client_max_body_size 50M;

    # 反向代理到 KBRefiner（docker 端口映射 8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket 转发（任务进度实时推送）
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}