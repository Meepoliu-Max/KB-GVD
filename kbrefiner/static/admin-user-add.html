    <style id="theme-vars">
/* 知序 KBRefiner — 产品前端设计系统 */

:root {
  /* ===== 品牌主色阶（单一主色） ===== */
  --kb-primary-50: #eff6ff;
  --kb-primary-100: #dbeafe;
  --kb-primary-200: #bfdbfe;
  --kb-primary-300: #93c5fd;
  --kb-primary-400: #60a5fa;
  --kb-primary-500: #3b82f6;
  --kb-primary-600: #2563eb;
  --kb-primary-700: #1d4ed8;
  --kb-primary-800: #1e40af;
  --kb-primary-900: #1e3a8a;

  /* ===== 中性色阶 ===== */
  --kb-neutral-0: #ffffff;
  --kb-neutral-50: #f8fafc;
  --kb-neutral-100: #f1f5f9;
  --kb-neutral-200: #e2e8f0;
  --kb-neutral-300: #cbd5e1;
  --kb-neutral-400: #94a3b8;
  --kb-neutral-500: #64748b;
  --kb-neutral-600: #475569;
  --kb-neutral-700: #334155;
  --kb-neutral-800: #1e293b;
  --kb-neutral-900: #0f172a;

  /* ===== 语义色（仅用于状态） ===== */
  --kb-state-success: #10b981;
  --kb-state-success-bg: #ecfdf5;
  --kb-state-warning: #f59e0b;
  --kb-state-warning-bg: #fffbeb;
  --kb-state-error: #ef4444;
  --kb-state-error-bg: #fef2f2;
  --kb-state-info: #0ea5e9;
  --kb-state-info-bg: #f0f9ff;

  /* ===== 语义别名 ===== */
  --kb-background: var(--kb-neutral-50);
  --kb-foreground: var(--kb-neutral-900);
  --kb-card: var(--kb-neutral-0);
  --kb-card-foreground: var(--kb-neutral-900);
  --kb-popover: var(--kb-neutral-0);
  --kb-popover-foreground: var(--kb-neutral-900);
  --kb-primary: var(--kb-primary-600);
  --kb-primary-foreground: var(--kb-neutral-0);
  --kb-muted: var(--kb-neutral-100);
  --kb-muted-foreground: var(--kb-neutral-500);
  --kb-border: var(--kb-neutral-200);
  --kb-input: var(--kb-neutral-200);
  --kb-ring: var(--kb-primary-300);

  --kb-radius-small: 4px;
  --kb-radius-medium: 8px;
  --kb-radius-large: 12px;

  /* ===== 字体系统 ===== */
  --kb-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --kb-font-mono: "GeistMono", "SF Mono", "Fira Code", ui-monospace, monospace;

  /* ===== 阴影 ===== */
  --kb-shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --kb-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --kb-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --kb-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --kb-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* ===== 间距 ===== */
  --kb-space-1: 4px;
  --kb-space-2: 8px;
  --kb-space-3: 12px;
  --kb-space-4: 16px;
  --kb-space-5: 20px;
  --kb-space-6: 24px;
  --kb-space-8: 32px;
  --kb-space-10: 40px;
  --kb-space-12: 48px;

  /* ===== 尺寸 ===== */
  --kb-header-height: 64px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--kb-font-sans);
  background: var(--kb-background);
  color: var(--kb-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.3;
  font-weight: 700;
  color: var(--kb-foreground);
}

h1 { font-size: 1.875rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }

p { color: var(--kb-neutral-600); line-height: 1.7; }

a { color: var(--kb-primary); text-decoration: none; }
a:hover { color: var(--kb-primary-700); }

.kb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--kb-space-2);
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--kb-radius-medium);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.kb-btn-primary { background: var(--kb-primary); color: var(--kb-primary-foreground); }
.kb-btn-primary:hover { background: var(--kb-primary-700); }
.kb-btn-secondary { background: var(--kb-neutral-0); color: var(--kb-neutral-700); border-color: var(--kb-border); }
.kb-btn-secondary:hover { background: var(--kb-neutral-50); border-color: var(--kb-neutral-300); }
.kb-btn-ghost { background: transparent; color: var(--kb-neutral-600); }
.kb-btn-ghost:hover { background: var(--kb-neutral-100); color: var(--kb-neutral-900); }
.kb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kb-btn-sm { padding: 6px 12px; font-size: 0.8125rem; }

.kb-card {
  background: var(--kb-card);
  border: 1px solid var(--kb-border);
  border-radius: var(--kb-radius-large);
  box-shadow: var(--kb-shadow-xs);
}

.kb-card-header {
  padding: var(--kb-space-5) var(--kb-space-6);
  border-bottom: 1px solid var(--kb-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--kb-space-4);
}

.kb-card-body { padding: var(--kb-space-6); }

.kb-input,
.kb-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--kb-input);
  border-radius: var(--kb-radius-medium);
  background: var(--kb-neutral-0);
  color: var(--kb-foreground);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.kb-input:focus,
.kb-select:focus {
  outline: none;
  border-color: var(--kb-primary-400);
  box-shadow: 0 0 0 3px var(--kb-primary-100);
}

.kb-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1;
}

.kb-tag-primary { background: var(--kb-primary-100); color: var(--kb-primary-700); }
.kb-tag-success { background: var(--kb-state-success-bg); color: #047857; }
.kb-tag-warning { background: var(--kb-state-warning-bg); color: #b45309; }
.kb-tag-error { background: var(--kb-state-error-bg); color: #b91c1c; }
.kb-tag-info { background: var(--kb-state-info-bg); color: #0369a1; }
.kb-tag-muted { background: var(--kb-neutral-100); color: var(--kb-neutral-600); }

.kb-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  font-weight: 600;
}

.kb-status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.kb-status-pending::before { background: var(--kb-neutral-400); }
.kb-status-running::before { background: var(--kb-state-info); }
.kb-status-success::before { background: var(--kb-state-success); }
.kb-status-warning::before { background: var(--kb-state-warning); }
.kb-status-error::before { background: var(--kb-state-error); }

.kb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.kb-table th,
.kb-table td {
  padding: var(--kb-space-3) var(--kb-space-4);
  text-align: left;
  border-bottom: 1px solid var(--kb-border);
}

.kb-table th {
  font-weight: 600;
  color: var(--kb-neutral-600);
  background: var(--kb-neutral-50);
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.kb-table tr:hover td { background: var(--kb-neutral-50); }

.kb-progress {
  width: 100%;
  height: 8px;
  background: var(--kb-neutral-200);
  border-radius: 9999px;
  overflow: hidden;
}

.kb-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--kb-primary-500), var(--kb-primary-600));
  border-radius: 9999px;
  transition: width 0.4s ease;
}

.kb-empty {
  text-align: center;
  padding: var(--kb-space-12) var(--kb-space-6);
  color: var(--kb-neutral-500);
}

.kb-text-muted { color: var(--kb-neutral-500); }
.kb-text-secondary { color: var(--kb-neutral-600); }
.kb-text-primary { color: var(--kb-primary); }
.kb-text-success { color: var(--kb-state-success); }
.kb-text-warning { color: var(--kb-state-warning); }
.kb-text-error { color: var(--kb-state-error); }
.kb-font-semibold { font-weight: 600; }
.kb-font-bold { font-weight: 700; }
.kb-text-sm { font-size: 0.875rem; }
.kb-text-xs { font-size: 0.75rem; }
.kb-truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
    </style>

    <div class="kb-modal-overlay" data-dom-id="overlay-add-user"></div>

    <!-- 添加用户弹窗：模态框 -->
    <div class="kb-modal" role="dialog" aria-modal="true" aria-labelledby="add-user-modal-title" data-dom-id="modal-add-user">
      <div class="kb-modal-header">
        <h3 class="kb-modal-title" id="add-user-modal-title">添加用户</h3>
        <a class="kb-btn kb-btn-ghost kb-modal-close" href="/admin/users" role="button" aria-label="关闭" data-dom-id="btn-close-add-user">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </a>
      </div>
      <form class="kb-modal-body" autocomplete="off" onsubmit="return false;">
        <div class="kb-modal-field">
          <label class="kb-modal-label" for="add-user-name">用户名</label>
          <input type="text" id="add-user-name" name="name" class="kb-input" placeholder="请输入用户名" data-dom-id="input-add-user-name">
        </div>
        <div class="kb-modal-field">
          <label class="kb-modal-label" for="add-user-email">邮箱</label>
          <input type="email" id="add-user-email" name="email" class="kb-input" placeholder="请输入邮箱地址" data-dom-id="input-add-user-email">
        </div>
        <div class="kb-modal-field">
          <label class="kb-modal-label" for="add-user-password">密码</label>
          <input type="password" id="add-user-password" name="password" class="kb-input" placeholder="请输入初始密码" data-dom-id="input-add-user-password">
          <p class="kb-modal-hint">用户首次登录后可自行修改</p>
        </div>
        <div class="kb-modal-field">
          <label class="kb-modal-label" for="add-user-role">角色</label>
          <select id="add-user-role" name="role" class="kb-select" data-dom-id="select-add-user-role">
            <option value="user" selected>普通用户</option>
            <option value="admin">管理员</option>
            <option value="super_admin">超级管理员</option>
          </select>
        </div>
        <div class="kb-modal-field">
          <label class="kb-modal-label" for="add-user-status">状态</label>
          <select id="add-user-status" name="status" class="kb-select" data-dom-id="select-add-user-status">
            <option value="active" selected>启用</option>
            <option value="disabled">禁用</option>
          </select>
        </div>
      </form>
      <div class="kb-modal-footer">
        <a class="kb-btn kb-btn-secondary" href="/admin/users" role="button" data-dom-id="btn-cancel-add-user">取消</a>
        <button class="kb-btn kb-btn-primary" type="button" data-dom-id="btn-confirm-add-user">确认添加</button>
      </div>
    </div>

    <script src="/static/js/kbrefiner.js"></script>
    <script>
      lucide.createIcons();

      // 侧边栏移动端切换
      (function () {
        var menuBtn = document.querySelector('[data-dom-id="btn-admin-menu"]');
        var sidebar = document.getElementById('adminSidebar');
        var overlay = document.getElementById('adminOverlay');
        function toggle() {
          sidebar.classList.toggle('is-open');
          overlay.classList.toggle('is-visible');
        }
        if (menuBtn) menuBtn.addEventListener('click', toggle);
        if (overlay) overlay.addEventListener('click', toggle);
      })();

      // ===== 权限守卫 =====
      let currentUser = null;
      (async () => {
        const { user } = await KBRefiner.Auth.me();
        if (!user || !['super_admin', 'admin'].includes(user.role)) {
          window.location.href = '/admin/login';
          return;
        }
        currentUser = user;
        document.getElementById('admin-name').textContent = user.username || '管理员';
        document.getElementById('admin-email').textContent = user.email || '-';
        document.getElementById('admin-avatar').textContent = (user.username || '管')[0];
        // 普通管理员不允许分配超级管理员角色：移除该选项
        if (user.role !== 'super_admin') {
          const opt = document.querySelector('#add-user-role option[value="super_admin"]');
          if (opt) opt.remove();
        }
      })();

      document.getElementById('btn-logout').addEventListener('click', async () => {
        await KBRefiner.Auth.logout().catch(() => {});
        window.location.href = '/admin/login';
      });

      // ===== 提交添加用户 =====
      document.querySelector('[data-dom-id="btn-confirm-add-user"]').addEventListener('click', async () => {
        const username = document.getElementById('add-user-name').value.trim();
        const email = document.getElementById('add-user-email').value.trim();
        const password = document.getElementById('add-user-password').value;
        const role = document.getElementById('add-user-role').value;
        const status = document.getElementById('add-user-status').value;

        if (!username) return alert('请输入用户名');
        if (!email || !email.includes('@')) return alert('请输入合法邮箱');
        if (password.length < 6) return alert('初始密码至少 6 位');

        const btn = document.querySelector('[data-dom-id="btn-confirm-add-user"]');
        btn.disabled = true;
        btn.textContent = '提交中...';
        try {
          await KBRefiner.Admin.createUser({ username, email, password, role, status });
          alert('用户创建成功');
          window.location.href = '/admin/users';
        } catch (e) {
          alert(e.message || '创建失败');
          btn.disabled = false;
          btn.textContent = '确认添加';
        }
      });
    </script>

      min-height: var(--kb-header-height);
    }
    .kb-admin-sidebar-brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--kb-primary-500), var(--kb-primary-700));
      border-radius: var(--kb-radius-medium);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--kb-neutral-0); font-size: 15px;
      flex-shrink: 0;
    }
    .kb-admin-sidebar-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .kb-admin-sidebar-brand-name { font-weight: 700; font-size: 0.9375rem; color: var(--kb-neutral-900); }
    .kb-admin-sidebar-brand-tag { font-size: 0.6875rem; color: var(--kb-neutral-500); }

    .kb-admin-nav {
      flex: 1;
      padding: var(--kb-space-3);
      display: flex;
      flex-direction: column;
      gap: var(--kb-space-1);
      overflow-y: auto;
    }
    .kb-admin-nav-section-label {
      font-size: 0.6875rem;
      font-weight: 700;
      color: var(--kb-neutral-400);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: var(--kb-space-3) var(--kb-space-3) var(--kb-space-1);
    }
    .kb-admin-nav-item {
      display: flex;
      align-items: center;
      gap: var(--kb-space-3);
      padding: 10px var(--kb-space-3);
      border-radius: var(--kb-radius-medium);
      color: var(--kb-neutral-600);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .kb-admin-nav-item:hover { background: var(--kb-neutral-100); color: var(--kb-neutral-900); }
    .kb-admin-nav-item i { width: 18px; height: 18px; flex-shrink: 0; }
    .kb-admin-nav-item.is-active {
      background: var(--kb-primary-50);
      color: var(--kb-primary-700);
      border-left-color: var(--kb-primary);
      font-weight: 600;
    }

    .kb-admin-sidebar-foot {
      padding: var(--kb-space-4);
      border-top: 1px solid var(--kb-border);
      display: flex;
      align-items: center;
      gap: var(--kb-space-3);
    }
    .kb-admin-sidebar-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--kb-primary-100); color: var(--kb-primary-700);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.875rem; flex-shrink: 0;
    }
    .kb-admin-sidebar-user { flex: 1; min-width: 0; }
    .kb-admin-sidebar-user-name { font-size: 0.8125rem; font-weight: 600; color: var(--kb-neutral-900); }
    .kb-admin-sidebar-user-role { font-size: 0.6875rem; color: var(--kb-neutral-500); }
    .kb-admin-sidebar-logout {
      background: transparent; border: none; cursor: pointer;
      color: var(--kb-neutral-500); padding: 6px; border-radius: var(--kb-radius-medium);
      display: flex; align-items: center; justify-content: center;
    }
    .kb-admin-sidebar-logout i { width: 18px; height: 18px; }
    .kb-admin-sidebar-logout:hover { background: var(--kb-neutral-100); color: var(--kb-state-error); }

    .kb-admin-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 35;
    }
    .kb-admin-overlay.is-visible { display: block; }

    /* 主区域 */
    .kb-admin-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .kb-admin-topbar {
      min-height: var(--kb-header-height);
      background: var(--kb-neutral-0);
      border-bottom: 1px solid var(--kb-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--kb-space-8);
      position: sticky; top: 0; z-index: 30;
      gap: var(--kb-space-4);
    }
    .kb-admin-topbar-left { display: flex; align-items: center; gap: var(--kb-space-3); min-width: 0; }
    .kb-admin-topbar-right { display: flex; align-items: center; gap: var(--kb-space-2); flex-shrink: 0; }
    .kb-admin-menu-btn {
      display: none;
      background: transparent; border: 1px solid var(--kb-border);
      border-radius: var(--kb-radius-medium);
      width: 36px; height: 36px;
      align-items: center; justify-content: center;
      cursor: pointer; color: var(--kb-neutral-700);
    }
    .kb-admin-menu-btn:hover { background: var(--kb-neutral-100); }
    .kb-admin-menu-btn i { width: 18px; height: 18px; }

    .kb-admin-breadcrumb { display: flex; align-items: center; gap: var(--kb-space-2); font-size: 0.875rem; color: var(--kb-neutral-500); }
    .kb-admin-breadcrumb a { color: var(--kb-neutral-500); }
    .kb-admin-breadcrumb a:hover { color: var(--kb-primary); }
    .kb-breadcrumb-sep { width: 14px; height: 14px; color: var(--kb-neutral-300); }
    .kb-admin-breadcrumb-current { color: var(--kb-neutral-900); font-weight: 600; }

    .kb-admin-content { padding: var(--kb-space-8); flex: 1; }

    /* 筛选区 */
    .kb-filter-header { flex-wrap: wrap; gap: var(--kb-space-4); }
    .kb-filters { display: flex; align-items: center; gap: var(--kb-space-4); flex-wrap: wrap; }
    .kb-filter-item { display: flex; align-items: center; gap: var(--kb-space-2); }
    .kb-filter-label { font-size: 0.8125rem; font-weight: 600; color: var(--kb-neutral-600); white-space: nowrap; }
    .kb-filter-select { width: auto; min-width: 132px; }
    .kb-search-wrap { position: relative; display: flex; align-items: center; }
    .kb-search-icon { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--kb-neutral-400); pointer-events: none; }
    .kb-search-input { padding-left: 36px; width: 260px; }

    /* 用户表 */
    .kb-user-table-wrap { overflow-x: auto; padding: 0; }
    .kb-user-table { min-width: 1180px; }
    .kb-user-table td { vertical-align: middle; }
    .kb-font-mono { font-family: var(--kb-font-mono); }
    .kb-row-actions { display: inline-flex; align-items: center; gap: var(--kb-space-1); flex-wrap: nowrap; }

    /* 自定义禁用状态（复用中性色 token） */
    .kb-status-disabled::before { background: var(--kb-neutral-400); }
    .kb-status-disabled { color: var(--kb-neutral-500); }

    /* 分页 */
    .kb-pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--kb-space-4) var(--kb-space-6);
      border-top: 1px solid var(--kb-border);
      gap: var(--kb-space-4);
      flex-wrap: wrap;
    }
    .kb-pagination-info { font-size: 0.8125rem; color: var(--kb-neutral-500); }
    .kb-pagination-info strong { color: var(--kb-neutral-900); font-weight: 700; }
    .kb-pagination-pages { display: flex; align-items: center; gap: var(--kb-space-1); }
    .kb-page-btn {
      min-width: 32px; height: 32px; padding: 0 8px;
      border: 1px solid var(--kb-border); background: var(--kb-neutral-0);
      border-radius: var(--kb-radius-medium);
      font-size: 0.8125rem; font-weight: 600; color: var(--kb-neutral-600);
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .kb-page-btn:hover:not(:disabled):not(.is-active) { background: var(--kb-neutral-50); border-color: var(--kb-neutral-300); color: var(--kb-neutral-900); }
    .kb-page-btn.is-active { background: var(--kb-primary); border-color: var(--kb-primary); color: var(--kb-primary-foreground); }
    .kb-page-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .kb-pagination-ellipsis { color: var(--kb-neutral-400); padding: 0 4px; }

    /* 用户详情抽屉 */
    .kb-drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 60;
      display: flex; justify-content: flex-end;
      backdrop-filter: blur(2px);
    }
    .kb-drawer-overlay.is-hidden { display: none; }
    .kb-drawer {
      width: 460px; max-width: 92vw; height: 100%;
      background: var(--kb-neutral-0);
      box-shadow: var(--kb-shadow-float);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .kb-drawer-head {
      padding: var(--kb-space-5) var(--kb-space-6);
      border-bottom: 1px solid var(--kb-border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: var(--kb-space-4);
    }
    .kb-drawer-head-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .kb-drawer-head h3 { font-size: 1.125rem; }
    .kb-drawer-sub { font-size: 0.8125rem; color: var(--kb-neutral-500); }
    .kb-drawer-close {
      background: transparent; border: none; cursor: pointer;
      color: var(--kb-neutral-500); padding: 6px; border-radius: var(--kb-radius-medium);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .kb-drawer-close i { width: 20px; height: 20px; }
    .kb-drawer-close:hover { background: var(--kb-neutral-100); color: var(--kb-neutral-900); }

    .kb-drawer-body { flex: 1; overflow-y: auto; padding: var(--kb-space-6); }
    .kb-drawer-section { margin-bottom: var(--kb-space-8); }
    .kb-drawer-section:last-child { margin-bottom: 0; }
    .kb-drawer-section-title {
      font-size: 0.8125rem; font-weight: 700; color: var(--kb-neutral-500);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: var(--kb-space-4);
    }

    .kb-info-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--kb-space-4);
    }
    .kb-info-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .kb-info-item dt { font-size: 0.75rem; color: var(--kb-neutral-500); }
    .kb-info-item dd { font-size: 0.875rem; color: var(--kb-neutral-900); }

    .kb-mini-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--kb-space-3); }
    .kb-mini-stat {
      background: var(--kb-neutral-50); border: 1px solid var(--kb-border);
      border-radius: var(--kb-radius-medium); padding: var(--kb-space-4);
    }
    .kb-mini-stat-value { font-size: 1.375rem; font-weight: 700; color: var(--kb-neutral-900); line-height: 1.2; }
    .kb-mini-stat-label { font-size: 0.75rem; color: var(--kb-neutral-500); margin-top: 2px; }

    .kb-recent-list { list-style: none; display: flex; flex-direction: column; }
    .kb-recent-task {
      display: flex; align-items: center; justify-content: space-between; gap: var(--kb-space-3);
      padding: var(--kb-space-3) 0; border-bottom: 1px solid var(--kb-border);
    }
    .kb-recent-task:last-child { border-bottom: none; }
    .kb-recent-task-name { display: flex; align-items: center; gap: var(--kb-space-2); min-width: 0; font-size: 0.875rem; color: var(--kb-neutral-700); }
    .kb-recent-task-icon { width: 16px; height: 16px; color: var(--kb-primary); flex-shrink: 0; }

    .kb-drawer-foot {
      padding: var(--kb-space-4) var(--kb-space-6);
      border-top: 1px solid var(--kb-border);
      display: flex; justify-content: flex-end; gap: var(--kb-space-3);
    }

    .kb-search-icon { width: 16px !important; height: 16px !important; }
    .kb-admin-nav-item i,
    .kb-admin-sidebar-logout i { width: 18px !important; height: 18px !important; }
    .kb-admin-menu-btn i { width: 18px !important; height: 18px !important; }
    .kb-drawer-close i { width: 20px !important; height: 20px !important; }
    .kb-recent-task-icon { width: 16px !important; height: 16px !important; }
    .kb-breadcrumb-sep { width: 14px !important; height: 14px !important; }

    /* ===== 添加用户弹窗 ===== */
    .kb-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 50;
    }
    .kb-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 51;
      width: 480px;
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
      background: var(--kb-neutral-0);
      border-radius: var(--kb-radius-large);
      border: 1px solid var(--kb-border);
      box-shadow: var(--kb-shadow-float);
      display: flex;
      flex-direction: column;
    }
    .kb-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--kb-space-4);
      padding: var(--kb-space-5) var(--kb-space-6);
      border-bottom: 1px solid var(--kb-border);
    }
    .kb-modal-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--kb-foreground);
      line-height: 1.3;
    }
    .kb-modal-close {
      padding: 6px;
      flex-shrink: 0;
    }
    .kb-modal-close i { width: 18px !important; height: 18px !important; }

    .kb-modal-body {
      padding: var(--kb-space-6);
      overflow-y: auto;
    }
    .kb-modal-field { margin-bottom: var(--kb-space-4); }
    .kb-modal-field:last-child { margin-bottom: 0; }
    .kb-modal-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--kb-neutral-700);
      margin-bottom: 6px;
    }
    .kb-modal-hint {
      font-size: 0.75rem;
      color: var(--kb-neutral-500);
      margin-top: 4px;
      line-height: 1.4;
    }

    .kb-modal-footer {
      padding: var(--kb-space-4) var(--kb-space-6);
      border-top: 1px solid var(--kb-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--kb-space-3);
    }

    @media (max-width: 1024px) {
      .kb-admin-sidebar {
        position: fixed; top: 0; left: 0; height: 100vh;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: var(--kb-shadow-lg);
      }
      .kb-admin-sidebar.is-open { transform: translateX(0); }
      .kb-admin-menu-btn { display: inline-flex; }
      .kb-admin-topbar { padding: 0 var(--kb-space-5); }
      .kb-admin-content { padding: var(--kb-space-5); }
    }
    @media (max-width: 768px) {
      .kb-admin-topbar { padding: 0 var(--kb-space-4); }
      .kb-admin-content { padding: var(--kb-space-4); }
      .kb-filter-header { flex-direction: column; align-items: stretch; }
      .kb-filters { width: 100%; }
      .kb-filter-item { width: 100%; }
      .kb-filter-select { width: 100%; }
      .kb-search-wrap { width: 100%; }
      .kb-search-input { width: 100%; }
      .kb-pagination { flex-direction: column; align-items: stretch; }
      .kb-pagination-pages { justify-content: center; }
      .kb-info-grid { grid-template-columns: 1fr; }
      .kb-mini-stats { grid-template-columns: repeat(2, 1fr); }
      .kb-drawer { width: 100%; max-width: 100vw; }
      .kb-modal { width: 100%; max-width: 92vw; }
    }
    </style>
</body>
</html>
