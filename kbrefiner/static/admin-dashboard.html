    <style id="theme-vars">
/* 知序 KBRefiner — 产品前端设计系统 */

:root {
  /* ===== 品牌主色阶（单一主色） ===== */
  --kb-primary-50: #eff6ff;
  --kb-primary-100: #dbeafe;
  --kb-primary-200: #bfdbfe;
  --kb-primary-300: #93c5fd;
  --kb-primary-400: #60a5fa;
  --kb-primary-500: #3b82f6;
  --kb-primary-600: #2563eb;
  --kb-primary-700: #1d4ed8;
  --kb-primary-800: #1e40af;
  --kb-primary-900: #1e3a8a;

  /* ===== 中性色阶 ===== */
  --kb-neutral-0: #ffffff;
  --kb-neutral-50: #f8fafc;
  --kb-neutral-100: #f1f5f9;
  --kb-neutral-200: #e2e8f0;
  --kb-neutral-300: #cbd5e1;
  --kb-neutral-400: #94a3b8;
  --kb-neutral-500: #64748b;
  --kb-neutral-600: #475569;
  --kb-neutral-700: #334155;
  --kb-neutral-800: #1e293b;
  --kb-neutral-900: #0f172a;

  /* ===== 语义色（仅用于状态） ===== */
  --kb-state-success: #10b981;
  --kb-state-success-bg: #ecfdf5;
  --kb-state-warning: #f59e0b;
  --kb-state-warning-bg: #fffbeb;
  --kb-state-error: #ef4444;
  --kb-state-error-bg: #fef2f2;
  --kb-state-info: #0ea5e9;
  --kb-state-info-bg: #f0f9ff;

  /* ===== 语义状态边框/文字（管理后台新增） ===== */
  --kb-state-success-border: #a7f3d0;
  --kb-state-success-text: #047857;
  --kb-state-warning-border: #fde68a;
  --kb-state-warning-text: #b45309;
  --kb-state-error-border: #fecaca;
  --kb-state-error-text: #b91c1c;
  --kb-state-info-border: #bae6fd;
  --kb-state-info-text: #0369a1;

  /* ===== 语义别名 ===== */
  --kb-background: var(--kb-neutral-50);
  --kb-foreground: var(--kb-neutral-900);
  --kb-card: var(--kb-neutral-0);
  --kb-card-foreground: var(--kb-neutral-900);
  --kb-popover: var(--kb-neutral-0);
  --kb-popover-foreground: var(--kb-neutral-900);
  --kb-primary: var(--kb-primary-600);
  --kb-primary-foreground: var(--kb-neutral-0);
  --kb-muted: var(--kb-neutral-100);
  --kb-muted-foreground: var(--kb-neutral-500);
  --kb-border: var(--kb-neutral-200);
  --kb-input: var(--kb-neutral-200);
  --kb-ring: var(--kb-primary-300);

  --kb-radius-small: 4px;
  --kb-radius-medium: 8px;
  --kb-radius-large: 12px;

  /* ===== 字体系统 ===== */
  --kb-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --kb-font-mono: "GeistMono", "SF Mono", "Fira Code", ui-monospace, monospace;

  /* ===== 阴影 ===== */
  --kb-shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --kb-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --kb-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --kb-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --kb-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* ===== 间距 ===== */
  --kb-space-1: 4px;
  --kb-space-2: 8px;
  --kb-space-3: 12px;
  --kb-space-4: 16px;
  --kb-space-5: 20px;
  --kb-space-6: 24px;
  --kb-space-8: 32px;
  --kb-space-10: 40px;
  --kb-space-12: 48px;

  /* ===== 尺寸 ===== */
  --kb-header-height: 64px;
  --kb-sidebar-width: 220px;
  --kb-sidebar-collapsed: 64px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--kb-font-sans);
  background: var(--kb-background);
  color: var(--kb-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.3;
  font-weight: 700;
  color: var(--kb-foreground);
}

h1 { font-size: 1.875rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }

p { color: var(--kb-neutral-600); line-height: 1.7; }

a { color: var(--kb-primary); text-decoration: none; }
a:hover { color: var(--kb-primary-700); }

.kb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--kb-space-2);
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--kb-radius-medium);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.kb-btn-primary { background: var(--kb-primary); color: var(--kb-primary-foreground); }
.kb-btn-primary:hover { background: var(--kb-primary-700); }
.kb-btn-secondary { background: var(--kb-neutral-0); color: var(--kb-neutral-700); border-color: var(--kb-border); }
.kb-btn-secondary:hover { background: var(--kb-neutral-50); border-color: var(--kb-neutral-300); }
.kb-btn-ghost { background: transparent; color: var(--kb-neutral-600); }
.kb-btn-ghost:hover { background: var(--kb-neutral-100); color: var(--kb-neutral-900); }
.kb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kb-btn-sm { padding: 6px 12px; font-size: 0.8125rem; }

.kb-card {
  background: var(--kb-card);
  border: 1px solid var(--kb-border);
  border-radius: var(--kb-radius-large);
  box-shadow: var(--kb-shadow-xs);
}

.kb-card-header {
  padding: var(--kb-space-5) var(--kb-space-6);
  border-bottom: 1px solid var(--kb-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--kb-space-4);
}

.kb-card-body { padding: var(--kb-space-6); }

.kb-input,
.kb-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--kb-input);
  border-radius: var(--kb-radius-medium);
  background: var(--kb-neutral-0);
  color: var(--kb-foreground);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.kb-input:focus,
.kb-select:focus {
  outline: none;
  border-color: var(--kb-primary-400);
  box-shadow: 0 0 0 3px var(--kb-primary-100);
}

.kb-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1;
}

.kb-tag-primary { background: var(--kb-primary-100); color: var(--kb-primary-700); }
.kb-tag-success { background: var(--kb-state-success-bg); color: #047857; }
.kb-tag-warning { background: var(--kb-state-warning-bg); color: #b45309; }
.kb-tag-error { background: var(--kb-state-error-bg); color: #b91c1c; }
.kb-tag-info { background: var(--kb-state-info-bg); color: #0369a1; }
.kb-tag-muted { background: var(--kb-neutral-100); color: var(--kb-neutral-600); }

.kb-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  font-weight: 600;
}

.kb-status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.kb-status-pending::before { background: var(--kb-neutral-400); }
.kb-status-running::before { background: var(--kb-state-info); }
.kb-status-success::before { background: var(--kb-state-success); }
.kb-status-warning::before { background: var(--kb-state-warning); }
.kb-status-error::before { background: var(--kb-state-error); }

.kb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.kb-table th,
.kb-table td {
  padding: var(--kb-space-3) var(--kb-space-4);
  text-align: left;
  border-bottom: 1px solid var(--kb-border);
}

.kb-table th {
  font-weight: 600;
  color: var(--kb-neutral-600);
  background: var(--kb-neutral-50);
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.kb-table tr:hover td { background: var(--kb-neutral-50); }

.kb-progress {
  width: 100%;
  height: 8px;
  background: var(--kb-neutral-200);
  border-radius: 9999px;
  overflow: hidden;
}

.kb-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--kb-primary-500), var(--kb-primary-600));
  border-radius: 9999px;
  transition: width 0.4s ease;
}

.kb-empty {
  text-align: center;
  padding: var(--kb-space-12) var(--kb-space-6);
  color: var(--kb-neutral-500);
}

.kb-text-muted { color: var(--kb-neutral-500); }
.kb-text-secondary { color: var(--kb-neutral-600); }
.kb-text-primary { color: var(--kb-primary); }
.kb-text-success { color: var(--kb-state-success); }
.kb-text-warning { color: var(--kb-state-warning); }
.kb-text-error { color: var(--kb-state-error); }
.kb-font-semibold { font-weight: 600; }
.kb-font-bold { font-weight: 700; }
.kb-text-sm { font-size: 0.875rem; }
.kb-text-xs { font-size: 0.75rem; }
.kb-truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
    </style>

    <script>
      lucide.createIcons();

      const esc = KBRefiner.escapeHtml;
      const fmtNum = n => Number(n || 0).toLocaleString('zh-CN');
      const fmtToken = n => {
        n = Number(n || 0);
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return String(n);
      };
      const fmtTime = ts => {
        if (!ts) return '-';
        const d = new Date(ts * 1000);
        const p = x => String(x).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      };

      // ===== 权限守卫：非管理员跳登录页 =====
      let currentUser = null;
      let trendDays = 7;

      async function guard() {
        const { user } = await KBRefiner.Auth.me();
        if (!user || !['super_admin', 'admin'].includes(user.role)) {
          window.location.href = '/admin/login';
          return false;
        }
        currentUser = user;
        document.getElementById('admin-name').textContent = user.username || '管理员';
        document.getElementById('admin-email').textContent = user.email || '-';
        document.getElementById('admin-avatar').textContent = (user.username || '管')[0];
        return true;
      }

      // ===== 登出 =====
      document.getElementById('btn-logout').addEventListener('click', async e => {
        e.preventDefault();
        await KBRefiner.Auth.logout().catch(() => {});
        window.location.href = '/admin/login';
      });

      // ===== 统计卡片 =====
      async function loadStats(days) {
        const s = await KBRefiner.Admin.stats();
        document.getElementById('stat-tasks').textContent = fmtNum(s.tasks.total);
        document.getElementById('stat-uploads').textContent = fmtNum(s.upload_total);
        document.getElementById('stat-tokens').textContent = fmtToken(s.tokens.total);
        document.getElementById('stat-users').textContent = fmtNum(s.users.total);
        document.getElementById('stat-failed').textContent = fmtNum(s.tasks.failed);
        drawTrendCharts(s.trends || []);
      }

      // ===== 趋势图（折线 + 柱状） =====
      function drawTrendCharts(trends) {
        const label = '近' + trendDays + '天';
        document.getElementById('tag-trend-days').textContent = label;
        document.getElementById('tag-trend-days-2').textContent = label;
        drawLineChart('chart-tasks', trends, d => d.task_count);
        drawBarChart('chart-tokens', trends, d => d.token_total);
      }

      function chartSkeleton(values, labels, fmt) {
        // 公共网格：viewBox 600x300，绘图区 x:40-580 y:20-260
        const max = Math.max(1, ...values);
        const niceMax = Math.ceil(max / 5) * 5 || 5;
        let grid = '', yaxis = '';
        for (let i = 0; i <= 5; i++) {
          const y = 20 + i * 48;
          grid += `<line x1="40" y1="${y}" x2="580" y2="${y}"></line>`;
          yaxis += `<text x="32" y="${y + 4}" text-anchor="end">${fmt(niceMax - (niceMax / 5) * i)}</text>`;
        }
        let xaxis = '';
        const step = 540 / Math.max(1, labels.length - 1);
        labels.forEach((t, i) => {
          const x = 40 + i * step;
          xaxis += `<text x="${x}" y="282" text-anchor="middle">${esc(t)}</text>`;
        });
        return { grid, yaxis, xaxis, step, max: niceMax };
      }

      function drawLineChart(containerId, data, pick) {
        const el = document.getElementById(containerId);
        if (!data.length) {
          el.innerHTML = '<div class="kb-text-muted" style="text-align:center;padding:60px 0;">暂无数据</div>';
          return;
        }
        const values = data.map(pick);
        const labels = data.map(d => d.date.slice(5)); // MM-DD
        const fmt = v => v >= 10000 ? Math.round(v / 1000) + 'K' : String(Math.round(v));
        const { grid, yaxis, xaxis, step, max } = chartSkeleton(values, labels, fmt);
        const y = v => 260 - (v / max) * 240;
        const pts = values.map((v, i) => `${40 + i * step},${y(v)}`);
        el.innerHTML = `
          <svg class="kb-chart-svg" viewBox="0 0 600 300" role="img" aria-label="任务趋势折线图">
            <g class="kb-chart-grid">${grid}</g>
            <g class="kb-chart-axis">${yaxis}</g>
            <path class="kb-chart-area" d="M${pts.join(' L')} L580,260 L40,260 Z"></path>
            <polyline class="kb-chart-line" points="${pts.join(' ')}"></polyline>
            <g class="kb-chart-dots">${values.map((v, i) => `<circle cx="${40 + i * step}" cy="${y(v)}" r="4"></circle>`).join('')}</g>
            <g class="kb-chart-axis">${xaxis}</g>
          </svg>`;
      }

      function drawBarChart(containerId, data, pick) {
        const el = document.getElementById(containerId);
        if (!data.length) {
          el.innerHTML = '<div class="kb-text-muted" style="text-align:center;padding:60px 0;">暂无数据</div>';
          return;
        }
        const values = data.map(pick);
        const labels = data.map(d => d.date.slice(5));
        const fmt = v => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1000 ? (v / 1000).toFixed(0) + 'K' : String(Math.round(v));
        const { grid, yaxis, xaxis, step, max } = chartSkeleton(values, labels, fmt);
        const barW = Math.min(48, step * 0.5);
        const bars = values.map((v, i) => {
          const h = (v / max) * 240;
          const x = 40 + i * step - barW / 2;
          return `<rect x="${x}" y="${260 - h}" width="${barW}" height="${h}" rx="3"></rect>`;
        }).join('');
        const xlabels = labels.map((t, i) =>
          `<text x="${40 + i * step}" y="282" text-anchor="middle">${esc(t)}</text>`).join('');
        el.innerHTML = `
          <svg class="kb-chart-svg" viewBox="0 0 600 300" role="img" aria-label="Token 消耗柱状图">
            <g class="kb-chart-grid">${grid}</g>
            <g class="kb-chart-axis">${yaxis}</g>
            <g class="kb-chart-bars">${bars}</g>
            <g class="kb-chart-axis">${xlabels}</g>
          </svg>`;
      }

      // ===== 用户消耗排行 =====
      async function loadRank() {
        const { users } = await KBRefiner.Admin.listUsers();
        const tbody = document.getElementById('rank-tbody');
        const sorted = users.filter(u => u.token_consumed > 0)
          .sort((a, b) => b.token_consumed - a.token_consumed).slice(0, 10);
        if (!sorted.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="kb-text-muted" style="text-align:center;padding:32px;">暂无消耗记录</td></tr>';
          return;
        }
        tbody.innerHTML = sorted.map((u, i) => `
          <tr>
            <td><span class="kb-rank-badge ${i < 3 ? 'kb-rank-badge--' + (i + 1) : ''}">${i + 1}</span></td>
            <td><div class="kb-rank-user"><div class="kb-rank-avatar ${i < 3 ? 'kb-rank-avatar--' + (i + 1) : ''}">${esc((u.username || '?')[0])}</div><span class="kb-font-semibold">${esc(u.username || '-')}</span></div></td>
            <td class="kb-text-muted kb-text-sm">${esc(u.email)}</td>
            <td class="kb-font-semibold">${fmtNum(u.task_count)}</td>
            <td>${fmtNum(u.upload_count)}</td>
            <td><span class="kb-font-bold kb-text-primary">${fmtToken(u.token_consumed)}</span></td>
            <td class="kb-text-muted kb-text-sm">${fmtTime(u.last_active_at)}</td>
          </tr>`).join('');
      }

      async function refresh() {
        await Promise.all([loadStats(trendDays), loadRank()]);
      }

      // ===== 时间范围切换 =====
      document.querySelectorAll('.kb-range-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          document.querySelectorAll('.kb-range-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          const map = { '今日': 1, '近7天': 7, '近30天': 30, '全部': 90 };
          trendDays = map[btn.textContent.trim()] || 7;
          await loadStats(trendDays);
        });
      });

      document.querySelector('[data-dom-id="btn-refresh"]').addEventListener('click', refresh);

      // ===== 初始化 =====
      (async () => {
        if (await guard()) {
          try { await refresh(); } catch (e) { console.error(e); }
        }
      })();
    </script>
