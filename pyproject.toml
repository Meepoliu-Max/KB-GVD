[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbrefiner"
version = "1.0.0"
description = "RAG 四阶流水线精度优化引擎：Clean → Chunk → QA → Tag"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [
    { name = "KBRefiner Team" },
]
keywords = ["rag", "knowledge-base", "pipeline", "chunking", "qa-generation", "document-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # LLM（OpenAI 兼容 SDK，支持 DeepSeek / OpenAI / Ollama 等）
    "openai>=1.50.0",
    # 配置与校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.0",
    # HTTP / 工具
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # CLI
    "click>=8.1.0",
    # 轻量文档解析（不依赖 MinerU）
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
# MinerU 一站式文档解析（含 OCR、表格提取、公式转 LaTeX）
mineru = [
    # mineral 需单独安装，参考 https://github.com/opendatalab/MinerU
    # 此处仅声明可选依赖占位
]
# 开发与测试
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
kbrefiner = "kbrefiner.cli:main"

[tool.setuptools.packages.find]
include = ["kbrefiner*"]

[tool.setuptools.package-data]
kbrefiner = [
    "static/**/*",
    "core/pipeline/prompts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
