<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 · KBRefiner 管理后台</title>
    <style id="theme-vars">
/* 知序 KBRefiner — 产品前端设计系统 */

:root {
  /* ===== 品牌主色阶（单一主色） ===== */
  --kb-primary-50: #eff6ff;
  --kb-primary-100: #dbeafe;
  --kb-primary-200: #bfdbfe;
  --kb-primary-300: #93c5fd;
  --kb-primary-400: #60a5fa;
  --kb-primary-500: #3b82f6;
  --kb-primary-600: #2563eb;
  --kb-primary-700: #1d4ed8;
  --kb-primary-800: #1e40af;
  --kb-primary-900: #1e3a8a;

  /* ===== 中性色阶 ===== */
  --kb-neutral-0: #ffffff;
  --kb-neutral-50: #f8fafc;
  --kb-neutral-100: #f1f5f9;
  --kb-neutral-200: #e2e8f0;
  --kb-neutral-300: #cbd5e1;
  --kb-neutral-400: #94a3b8;
  --kb-neutral-500: #64748b;
  --kb-neutral-600: #475569;
  --kb-neutral-700: #334155;
  --kb-neutral-800: #1e293b;
  --kb-neutral-900: #0f172a;

  /* ===== 语义色（仅用于状态） ===== */
  --kb-state-success: #10b981;
  --kb-state-success-bg: #ecfdf5;
  --kb-state-warning: #f59e0b;
  --kb-state-warning-bg: #fffbeb;
  --kb-state-error: #ef4444;
  --kb-state-error-bg: #fef2f2;
  --kb-state-info: #0ea5e9;
  --kb-state-info-bg: #f0f9ff;

  /* ===== 语义别名 ===== */
  --kb-background: var(--kb-neutral-50);
  --kb-foreground: var(--kb-neutral-900);
  --kb-card: var(--kb-neutral-0);
  --kb-card-foreground: var(--kb-neutral-900);
  --kb-popover: var(--kb-neutral-0);
  --kb-popover-foreground: var(--kb-neutral-900);
  --kb-primary: var(--kb-primary-600);
  --kb-primary-foreground: var(--kb-neutral-0);
  --kb-muted: var(--kb-neutral-100);
  --kb-muted-foreground: var(--kb-neutral-500);
  --kb-border: var(--kb-neutral-200);
  --kb-input: var(--kb-neutral-200);
  --kb-ring: var(--kb-primary-300);

  --kb-radius-small: 4px;
  --kb-radius-medium: 8px;
  --kb-radius-large: 12px;

  /* ===== 字体系统 ===== */
  --kb-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --kb-font-mono: "GeistMono", "SF Mono", "Fira Code", ui-monospace, monospace;

  /* ===== 阴影 ===== */
  --kb-shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --kb-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --kb-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --kb-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --kb-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* ===== 间距 ===== */
  --kb-space-1: 4px;
  --kb-space-2: 8px;
  --kb-space-3: 12px;
  --kb-space-4: 16px;
  --kb-space-5: 20px;
  --kb-space-6: 24px;
  --kb-space-8: 32px;
  --kb-space-10: 40px;
  --kb-space-12: 48px;

  /* ===== 尺寸 ===== */
  --kb-header-height: 64px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--kb-font-sans);
  background: var(--kb-background);
  color: var(--kb-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.3;
  font-weight: 700;
  color: var(--kb-foreground);
}

h1 { font-size: 1.875rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }

p { color: var(--kb-neutral-600); line-height: 1.7; }

a { color: var(--kb-primary); text-decoration: none; }
a:hover { color: var(--kb-primary-700); }

.kb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--kb-space-2);
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--kb-radius-medium);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.kb-btn-primary { background: var(--kb-primary); color: var(--kb-primary-foreground); }
.kb-btn-primary:hover { background: var(--kb-primary-700); }
.kb-btn-secondary { background: var(--kb-neutral-0); color: var(--kb-neutral-700); border-color: var(--kb-border); }
.kb-btn-secondary:hover { background: var(--kb-neutral-50); border-color: var(--kb-neutral-300); }
.kb-btn-ghost { background: transparent; color: var(--kb-neutral-600); }
.kb-btn-ghost:hover { background: var(--kb-neutral-100); color: var(--kb-neutral-900); }
.kb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kb-btn-sm { padding: 6px 12px; font-size: 0.8125rem; }

.kb-card {
  background: var(--kb-card);
  border: 1px solid var(--kb-border);
  border-radius: var(--kb-radius-large);
  box-shadow: var(--kb-shadow-xs);
}

.kb-card-header {
  padding: var(--kb-space-5) var(--kb-space-6);
  border-bottom: 1px solid var(--kb-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--kb-space-4);
}

.kb-card-body { padding: var(--kb-space-6); }

.kb-input,
.kb-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--kb-input);
  border-radius: var(--kb-radius-medium);
  background: var(--kb-neutral-0);
  color: var(--kb-foreground);
  font-family: var(--kb-font-sans);
  font-size: 0.875rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.kb-input:focus,
.kb-select:focus {
  outline: none;
  border-color: var(--kb-primary-400);
  box-shadow: 0 0 0 3px var(--kb-primary-100);
}

.kb-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1;
}

.kb-tag-primary { background: var(--kb-primary-100); color: var(--kb-primary-700); }
.kb-tag-success { background: var(--kb-state-success-bg); color: #047857; }
.kb-tag-warning { background: var(--kb-state-warning-bg); color: #b45309; }
.kb-tag-error { background: var(--kb-state-error-bg); color: #b91c1c; }
.kb-tag-info { background: var(--kb-state-info-bg); color: #0369a1; }
.kb-tag-muted { background: var(--kb-neutral-100); color: var(--kb-neutral-600); }

.kb-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  font-weight: 600;
}

.kb-status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.kb-status-pending::before { background: var(--kb-neutral-400); }
.kb-status-running::before { background: var(--kb-state-info); }
.kb-status-success::before { background: var(--kb-state-success); }
.kb-status-warning::before { background: var(--kb-state-warning); }
.kb-status-error::before { background: var(--kb-state-error); }

.kb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.kb-table th,
.kb-table td {
  padding: var(--kb-space-3) var(--kb-space-4);
  text-align: left;
  border-bottom: 1px solid var(--kb-border);
}

.kb-table th {
  font-weight: 600;
  color: var(--kb-neutral-600);
  background: var(--kb-neutral-50);
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.kb-table tr:hover td { background: var(--kb-neutral-50); }

.kb-progress {
  width: 100%;
  height: 8px;
  background: var(--kb-neutral-200);
  border-radius: 9999px;
  overflow: hidden;
}

.kb-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--kb-primary-500), var(--kb-primary-600));
  border-radius: 9999px;
  transition: width 0.4s ease;
}

.kb-empty {
  text-align: center;
  padding: var(--kb-space-12) var(--kb-space-6);
  color: var(--kb-neutral-500);
}

.kb-text-muted { color: var(--kb-neutral-500); }
.kb-text-secondary { color: var(--kb-neutral-600); }
.kb-text-primary { color: var(--kb-primary); }
.kb-text-success { color: var(--kb-state-success); }
.kb-text-warning { color: var(--kb-state-warning); }
.kb-text-error { color: var(--kb-state-error); }
.kb-font-semibold { font-weight: 600; }
.kb-font-bold { font-weight: 700; }
.kb-text-sm { font-size: 0.875rem; }
.kb-text-xs { font-size: 0.75rem; }
.kb-truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
    </style>

<body class="min-h-screen font-sans antialiased">
    <div class="kb-admin-layout">
      <!-- 侧边栏 -->
      <aside class="kb-admin-sidebar" id="adminSidebar">
        <div class="kb-admin-sidebar-head">
          <div class="kb-admin-sidebar-brand-icon">知</div>
          <div class="kb-admin-sidebar-brand-text">
            <span class="kb-admin-sidebar-brand-name">KBRefiner</span>
            <span class="kb-admin-sidebar-brand-tag">管理后台</span>
          </div>
        </div>
        <nav class="kb-admin-nav" aria-label="管理后台导航">
          <span class="kb-admin-nav-section-label">主导航</span>
          <a class="kb-admin-nav-item" href="/admin/dashboard" data-dom-id="nav-dashboard">

          </a>
          <a class="kb-admin-nav-item is-active" href="/admin/users" data-dom-id="nav-users" aria-current="page">

          <a class="kb-admin-nav-item" href="#" data-dom-id="nav-messages">
            <i data-lucide="megaphone"></i><span>消息列表</span>
          </a>
          <a class="kb-admin-nav-item" href="#" data-dom-id="nav-access">
            <i data-lucide="shield"></i><span>黑白名单</span>
          </a>
          <a class="kb-admin-nav-item" href="#" data-dom-id="nav-settings">
            <i data-lucide="settings"></i><span>系统设置</span>
          </a>
        </nav>
        <div class="kb-admin-sidebar-foot">
          <div class="kb-admin-sidebar-avatar" id="admin-avatar">管</div>

    <script src="/static/js/kbrefiner.js"></script>
    <script>
      lucide.createIcons();

      // 侧边栏移动端切换
      (function () {
        var menuBtn = document.querySelector('[data-dom-id="btn-admin-menu"]');
        var sidebar = document.getElementById('adminSidebar');
        var overlay = document.getElementById('adminOverlay');
        function toggle() {
          sidebar.classList.toggle('is-open');
          overlay.classList.toggle('is-visible');
        }
        if (menuBtn) menuBtn.addEventListener('click', toggle);
        if (overlay) overlay.addEventListener('click', toggle);
      })();

      const esc = KBRefiner.escapeHtml;
      const fmtToken = n => {
        n = Number(n || 0);
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return String(n);
      };
      const fmtDate = ts => {
        if (!ts) return '-';
        const d = new Date(ts * 1000);
        const p = x => String(x).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      };

      const ROLE_TAG = {
        super_admin: '<span class="kb-tag kb-tag-primary">超级管理员</span>',
        admin: '<span class="kb-tag kb-tag-info">管理员</span>',
        user: '<span class="kb-tag kb-tag-muted">普通用户</span>',
      };

      // ===== 权限守卫 =====
      let currentUser = null;
      async function guard() {
        const { user } = await KBRefiner.Auth.me();
        if (!user || !['super_admin', 'admin'].includes(user.role)) {
          window.location.href = '/admin/login';
          return false;
        }
        currentUser = user;
        document.getElementById('admin-name').textContent = user.username || '管理员';
        document.getElementById('admin-email').textContent = user.email || '-';
        document.getElementById('admin-avatar').textContent = (user.username || '管')[0];
        return true;
      }

      document.getElementById('btn-logout').addEventListener('click', async () => {
        await KBRefiner.Auth.logout().catch(() => {});
        window.location.href = '/admin/login';
      });

      ['nav-messages', 'nav-access', 'nav-settings'].forEach(id => {
        const el = document.querySelector(`[data-dom-id="${id}"]`);
        if (el) el.addEventListener('click', e => {
          e.preventDefault();
          alert('该模块规划中，尚未开放');
        });
      });

      // ===== 用户列表 =====
      async function loadUsers() {
        const tbody = document.getElementById('users-tbody');
        const params = {
          search: document.getElementById('input-user-search').value.trim(),
          role: document.getElementById('filter-role').value,
          status: document.getElementById('filter-status').value,
        };
        let data;
        try {
          data = await KBRefiner.Admin.listUsers(params);
        } catch (e) {
          tbody.innerHTML = `<tr><td colspan="11" class="kb-text-muted" style="text-align:center;padding:40px;">${esc(e.message)}</td></tr>`;
          return;
        }
        document.getElementById('users-total').textContent = data.total;
        if (!data.users.length) {
          tbody.innerHTML = '<tr><td colspan="11" class="kb-text-muted" style="text-align:center;padding:40px;">没有符合条件的用户</td></tr>';
          return;
        }
        tbody.innerHTML = data.users.map(u => {
          const isSelf = currentUser && currentUser.id === u.id;
          const canToggle = u.status === 'active' && !isSelf;
          return `
          <tr>
            <td class="kb-font-mono kb-text-muted">${esc(u.id)}</td>
            <td class="kb-font-semibold">${esc(u.username || '-')}${isSelf ? ' <span class="kb-tag kb-tag-muted">我</span>' : ''}</td>
            <td class="kb-text-secondary">${esc(u.email)}</td>
            <td>${ROLE_TAG[u.role] || esc(u.role)}</td>
            <td>${u.status === 'active'
              ? '<span class="kb-status kb-status-success">启用</span>'
              : '<span class="kb-status kb-status-error">禁用</span>'}</td>
            <td>${Number(u.task_count || 0)}</td>
            <td>${Number(u.upload_count || 0)}</td>
            <td>${fmtToken(u.token_consumed)}</td>
            <td class="kb-text-muted">${fmtDate(u.created_at)}</td>
            <td class="kb-text-muted">${fmtDate(u.last_active_at)}</td>
            <td>
              <div class="kb-row-actions">
                <a class="kb-btn kb-btn-ghost kb-btn-sm" href="/admin/users/${encodeURIComponent(u.id)}">查看</a>
                <button class="kb-btn kb-btn-ghost kb-btn-sm" type="button" data-act="toggle" data-id="${esc(u.id)}" data-status="${esc(u.status)}" data-name="${esc(u.username || u.email)}" ${canToggle ? '' : 'disabled'}>${u.status === 'active' ? '禁用' : '启用'}</button>
                <button class="kb-btn kb-btn-ghost kb-btn-sm" type="button" data-act="reset" data-id="${esc(u.id)}" data-name="${esc(u.username || u.email)}">重置密码</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      }

      // 行操作（事件委托）
      document.getElementById('users-tbody').addEventListener('click', async e => {
        const btn = e.target.closest('button[data-act]');
        if (!btn || btn.disabled) return;
        const { act, id, status, name } = btn.dataset;
        try {
          if (act === 'toggle') {
            const next = status === 'active' ? 'disabled' : 'active';
            if (!confirm(`确认${next === 'disabled' ? '禁用' : '启用'}用户「${name}」？`)) return;
            await KBRefiner.Admin.updateUser(id, { status: next });
          } else if (act === 'reset') {
            const pwd = prompt(`为用户「${name}」设置新密码（至少 6 位）：`);
            if (!pwd) return;
            if (pwd.length < 6) { alert('密码至少 6 位'); return; }
            await KBRefiner.Admin.resetPassword(id, pwd);
            alert('密码已重置');
          }
          await loadUsers();
        } catch (err) {
          alert(err.message || '操作失败');
        }
      });

      // 筛选联动
      let searchTimer = null;
      document.getElementById('input-user-search').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadUsers, 300);
      });
      document.getElementById('filter-role').addEventListener('change', loadUsers);
      document.getElementById('filter-status').addEventListener('change', loadUsers);

      // ===== 初始化 =====
      (async () => {
        if (await guard()) await loadUsers();
      })();
    </script>
